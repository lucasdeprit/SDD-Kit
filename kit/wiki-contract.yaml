# Contrato que toda wiki de proyecto debe cumplir para que agentes y skills
# del kit funcionen sin conocer el proyecto.
#
# index.md debe tener una cabecera (##) por sección obligatoria, con al menos
# un enlace relativo a una página existente debajo de ella.
# "aliases" permite usar otros títulos (p. ej. en inglés) sin romper el contrato.

index: index.md

sections:
  - id: scope
    title: Scope
    aliases: [Alcance]
  - id: arquitectura
    title: Arquitectura
    aliases: [Architecture]
  - id: convenciones
    title: Convenciones
    aliases: [Conventions, Buenas prácticas]
  - id: mapa-codigo
    title: Mapa del código
    aliases: [Code map, Estructura del repositorio]
  - id: nueva-funcionalidad
    title: Cómo añadir una funcionalidad
    aliases: [How to add a feature, Nueva funcionalidad]
  - id: comandos
    title: Comandos
    aliases: [Commands, Build y tests]
  - id: testing
    title: Testing
    aliases: [Tests, Estrategia de testing]
