# CI del propio kit: tests de los scripts y validación del schema con el CLI real de OpenSpec.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Tests de los scripts
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar el kit en un proyecto de prueba y validar con OpenSpec
        run: |
          set -e
          demo="$(mktemp -d)"
          printf 'project: Demo\nwiki: docs/wiki\nstacks: [ios, android]\nharnesses: [copilot, claude]\n' > "$demo/ai-kit.yaml"
          python3 scripts/sync.py "$demo"
          python3 scripts/sync.py "$demo" --check
          python3 scripts/check_wiki.py "$demo"
          cd "$demo"
          npx -y @fission-ai/openspec@latest schema validate sdd-kit
